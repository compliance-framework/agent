name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-image.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    with:
      # ghcr.io/compliance-framework/agent, agent-ci and agent-custodian, as released before.
      # ci.yml passes the same list to its image check: change both together.
      images: >-
        [{"name": "agent", "dockerfile": "Dockerfile", "context": "."},
         {"name": "agent-ci", "dockerfile": "Dockerfile-ci", "context": "."},
         {"name": "agent-custodian", "dockerfile": "Dockerfile-custodian", "context": "."}]
    permissions:
      contents: read
      packages: write
    secrets: inherit
