name: ci

on:
  pull_request:
    # edited: the PR title check re-runs after a title edit.
    # labeled/unlabeled: release-checks reads the PR's labels from the event.
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-go-service.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    with:
      # check-opa-version: the agent and the API must evaluate policies with the same OPA.
      # check-proto: the committed generated code matches `buf generate` (skipped without buf).
      make-targets: check-opa-version check-proto
      # The image check scans the same list release.yml publishes: agent, agent-ci and
      # agent-custodian.
      images: >-
        [{"name": "agent", "dockerfile": "Dockerfile", "context": "."},
         {"name": "agent-ci", "dockerfile": "Dockerfile-ci", "context": "."},
         {"name": "agent-custodian", "dockerfile": "Dockerfile-custodian", "context": "."}]
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
